name: Deploy

on:
  workflow_run:
    workflows: ["Test"]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Docker Hub 로그인
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 환경이 둘이라 latest 하나를 공유하면 스테이징 배포가 운영이 받을 이미지를 바꿔 버린다.
      # 커밋 SHA 태그는 덮어써지지 않으므로 운영은 승인한 커밋의 이미지만 받는다.
      - name: 이미지 빌드 & push
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/nawa-backend:${{ github.event.workflow_run.head_sha }}

  # 스테이징은 main 병합 뒤 자동으로 배포한다.
  deploy-staging:
    needs: build-and-push
    # 호출한 잡이 id-token 권한을 주지 않으면 재사용 워크플로가 OIDC 토큰을 받지 못한다.
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ssm.yml
    with:
      environment: staging
      deploy_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit

  # 운영은 스테이징이 성공한 뒤 production Environment의 승인을 받아 배포한다.
  # 운영 인프라가 준비되기 전에는 저장소 변수 PRODUCTION_ENABLED가 없어 이 잡이 건너뛰어진다.
  deploy-production:
    needs: deploy-staging
    if: vars.PRODUCTION_ENABLED == 'true'
    permissions:
      id-token: write
      contents: read
    uses: ./.github/workflows/deploy-ssm.yml
    with:
      environment: production
      deploy_sha: ${{ github.event.workflow_run.head_sha }}
    secrets: inherit
