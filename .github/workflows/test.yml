name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: JDK 17 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle 캐시
        uses: actions/cache@v6
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('backend/**/*.gradle*', 'backend/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 빌드 + 테스트
        run: ./gradlew build --no-daemon

  frontend-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: pnpm 설정
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Node.js 설정
        uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: 의존성 설치
        run: pnpm install --frozen-lockfile

      - name: 포맷 검사
        run: pnpm format:check

      - name: 린트 검사
        run: pnpm lint

      - name: 타입 검사
        run: pnpm type-check

      - name: 단위 테스트
        run: pnpm --filter @na-wa/frontend test:unit --run

      - name: 프로덕션 빌드
        run: pnpm build
