# 부하 테스트용 오버레이. 운영 compose 위에 얹어서 쓴다.
#
#   docker compose -p nawa-loadtest \
#     -f docker-compose.yml -f docker-compose.ec2-clone.yml up -d
#
# `-f`를 명시하면 docker-compose.override.yml(로컬 개발용)이 자동으로 끼어들지 않는다.
# 그 파일은 backend를 0.0.0.0:8080에 열고 frontend를 띄우므로 측정에 섞이면 안 된다.
#
# ── `-p nawa-loadtest`를 반드시 붙인다 ──────────────────────────────────
# 빼면 프로젝트 이름이 디렉터리 이름(na-wa)이 되어 **평소 개발용으로 띄워 둔 컨테이너를
# 그대로 갈아치운다.** 볼륨도 공유해서 부하 테스트 시드 데이터가 개발 DB에 섞인다.
# 이름을 분리하면 컨테이너·볼륨·네트워크가 모두 따로 만들어진다.
#
# 포트도 개발 스택과 겹치지 않게 9080번대로 뒀지만, 부하 테스트 중에는 개발 스택을
# 내려 두는 편이 좋다. 같은 호스트 자원을 나눠 쓰면 측정값이 흐려진다.
#
# 이 파일은 EC2로 배포되지 않는다. deploy.yml이 보내는 것은 docker-compose.yml과
# nginx/nginx.conf, deploy/deploy.sh 뿐이다.
#
# ── 리소스 제한을 여기에 적지 않는 이유 ──────────────────────────────────
# Docker Desktop VM 전체를 CPU 2 · 메모리 2.25GiB로 둔다. 이 중 cAdvisor와
# node-exporter는 각각 최대 128MiB까지만 쓸 수 있고, SUT 네 컨테이너
# (nginx·backend·mysql·redis)는 Docker VM 자체 오버헤드와 남은 자원을 공유한다.
# 따라서 SUT에 정확히 2GiB가 예약되는 구조는 아니다. 개별 제한을 두지 않는 이유는
# 실제 EC2처럼 네 프로세스가 서로 남는 자원을 빌려 쓰고 같은 OOM 조건을 겪게 하려는
# 것이다. 절대 용량 재현이 아니라 병목 위치를 찾기 위한 근사 환경이다.
services:
  backend:
    build:
      context: ./backend
      args:
        # 부하 테스트 로그인 경로를 이 빌드에만 포함한다. 운영 빌드(CI)는 이 인자를
        # 넘기지 않으므로 Docker Hub 이미지에는 해당 클래스가 없다.
        GRADLE_ARGS: -Ploadtest
    environment:
      # 운영과 같은 힙 상한으로 맞춘다. 지정하지 않으면 JDK가 Docker VM 전체
      # (2.25GiB)의 25%를 잡아 운영(약 512MB)과 달라진다.
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      # Prometheus가 nginx를 거치지 않고 /internal/metrics를 직접 읽는다.
      # 127.0.0.1에만 연다 — 0.0.0.0이면 같은 네트워크의 다른 기기가
      # 부하 테스트 로그인 경로에 닿을 수 있다.
      # 9080번대를 쓰는 것은 개발 스택(8080)과 겹치지 않게 하려는 것이다.
      - "127.0.0.1:9081:8080"

  nginx:
    volumes:
      # 운영 설정은 여기서 그대로 쓸 수 없다. TLS 인증서 파일이 로컬에 없고,
      # 80으로 온 요청을 308로 https에 넘겨서 k6가 무한히 되돌아온다.
      - ./loadtest/nginx.conf:/etc/nginx/nginx.conf:ro
    # Compose는 기본값으로 base의 80/443 포트와 overlay 포트를 합친다.
    # !override로 운영 포트를 버려야 부하 테스트 로그인 경로가 LAN에 열리지 않는다.
    ports: !override
      - "127.0.0.1:9080:80"

  mysql:
    ports:
      # 시드 스크립트를 밖에서 밀어 넣기 위해 연다.
      - "127.0.0.1:13306:3306"

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    command:
      # 도커 컨테이너만 본다. 안 그러면 VM의 시스템 cgroup까지 긁어 와서
      # 지표 수가 불필요하게 커진다.
      - --docker_only=true
      - --housekeeping_interval=10s
    ports:
      - "127.0.0.1:9082:8080"
    # 관측 도구는 측정 대상 예산 밖에 둔다.
    mem_limit: 128m
    cpus: 0.15
    networks:
      - nawa-network

  node-exporter:
    image: prom/node-exporter:v1.9.1
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
    ports:
      - "127.0.0.1:9100:9100"
    mem_limit: 128m
    cpus: 0.10
    networks:
      - nawa-network
