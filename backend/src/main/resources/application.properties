jdbc.driver=${DATABASE_DRIVER}
jdbc.url=${DATABASE_URL}
jdbc.username=${DATABASE_USERNAME}
jdbc.password=${DATABASE_PASSWORD}

redis.host=${REDIS_HOST}
redis.port=${REDIS_PORT:6379}
redis.username=${REDIS_USERNAME:}
redis.password=${REDIS_PASSWORD:}
redis.ssl-enabled=${REDIS_SSL_ENABLED:false}
redis.timeout-millis=${REDIS_TIMEOUT_MILLIS:2000}
redis.key-prefix=${REDIS_KEY_PREFIX:nawa:}

auth.jwt.secret=${JWT_SECRET}
auth.jwt.issuer=${JWT_ISSUER:nawa}
auth.jwt.access-token-ttl-seconds=${JWT_ACCESS_TOKEN_TTL_SECONDS:900}
auth.refresh-token-ttl-seconds=${REFRESH_TOKEN_TTL_SECONDS:1209600}
auth.oauth-state-ttl-seconds=${OAUTH_STATE_TTL_SECONDS:600}

auth.cookie.secure=${AUTH_COOKIE_SECURE:true}
auth.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
auth.cookie.domain=${AUTH_COOKIE_DOMAIN:}
auth.cookie.access-token-name=${AUTH_ACCESS_COOKIE_NAME:access_token}
auth.cookie.refresh-token-name=${AUTH_REFRESH_COOKIE_NAME:refresh_token}

auth.frontend.success-url=${AUTH_FRONTEND_SUCCESS_URL}
auth.frontend.failure-url=${AUTH_FRONTEND_FAILURE_URL}
auth.frontend.allowed-return-paths=${AUTH_FRONTEND_ALLOWED_RETURN_PATHS:/}
auth.allowed-origins=${AUTH_ALLOWED_ORIGINS}

oauth.google.client-id=${GOOGLE_OAUTH_CLIENT_ID:}
oauth.google.client-secret=${GOOGLE_OAUTH_CLIENT_SECRET:}
oauth.google.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/google}
oauth.google.scopes=${GOOGLE_OAUTH_SCOPES:openid,profile,email}

oauth.line.client-id=${LINE_OAUTH_CLIENT_ID:}
oauth.line.client-secret=${LINE_OAUTH_CLIENT_SECRET:}
oauth.line.redirect-uri=${LINE_OAUTH_REDIRECT_URI:http://localhost:8080/api/v1/auth/oauth2/callback/line}
oauth.line.scopes=${LINE_OAUTH_SCOPES:openid,profile}
