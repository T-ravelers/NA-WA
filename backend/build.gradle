plugins {
    id 'java'
    id 'war'
}

group 'me.nawa'
version '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

ext {
    junitVersion = '6.1.2'
    springVersion = '5.3.39'
    lombokVersion = '1.18.46'
    springSecurityVersion = '5.8.16'
    springDataRedisVersion = '2.7.18'
    lettuceVersion = '6.1.10.RELEASE'
    flywayVersion = '12.11.0'
    jjwtVersion = '0.13.0'
    log4jVersion = '2.26.1'
    jacksonVersion = '2.22.1'
    jacksonToolsVersion = '3.1.5'
    awsSdkVersion = '2.46.7'
    micrometerVersion = '1.14.4'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

dependencies {
    implementation platform("org.springframework:spring-framework-bom:${springVersion}")
    implementation platform("org.springframework.security:spring-security-bom:${springSecurityVersion}")
    implementation platform("org.apache.logging.log4j:log4j-bom:${log4jVersion}")
    implementation platform("com.fasterxml.jackson:jackson-bom:${jacksonVersion}")
    implementation platform("tools.jackson:jackson-bom:${jacksonToolsVersion}")
    implementation platform("software.amazon.awssdk:bom:${awsSdkVersion}")

    // JWT
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    // Swagger
    implementation 'io.springfox:springfox-swagger2:2.9.2'
    implementation 'io.springfox:springfox-swagger-ui:2.9.2'

    // Spring Security
    implementation 'org.springframework.security:spring-security-core'
    implementation 'org.springframework.security:spring-security-web'
    implementation 'org.springframework.security:spring-security-config'
    implementation 'org.springframework.security:spring-security-oauth2-client'
    implementation 'org.springframework.security:spring-security-oauth2-jose'

    // DB
    implementation 'com.mysql:mysql-connector-j:9.7.0'
    implementation 'com.zaxxer:HikariCP:7.1.0'

    // Redis
    implementation "org.springframework.data:spring-data-redis:${springDataRedisVersion}"
    implementation "io.lettuce:lettuce-core:${lettuceVersion}"

    // Flyway (DB 마이그레이션)
    implementation "org.flywaydb:flyway-core:${flywayVersion}"
    implementation "org.flywaydb:flyway-mysql:${flywayVersion}"

    implementation 'org.springframework:spring-tx'
    implementation 'org.springframework:spring-jdbc'

    implementation 'org.mybatis:mybatis:3.5.19'
    implementation 'org.mybatis:mybatis-spring:2.1.2'

    // Spring
    implementation ('org.springframework:spring-context')
            { exclude group: 'commons-logging', module: 'commons-logging' }
    implementation 'org.springframework:spring-webmvc'

    // Servlet
    compileOnly 'javax.servlet:javax.servlet-api:4.0.1'
    testImplementation 'javax.servlet:javax.servlet-api:4.0.1'

    // JSR-250 (@PostConstruct 등, JDK 11부터 javax.annotation이 제거되어 별도 의존성 필요)
    implementation 'javax.annotation:javax.annotation-api:1.3.2'

    // Logging
    implementation 'org.apache.logging.log4j:log4j-api'
    runtimeOnly 'org.apache.logging.log4j:log4j-core'
    runtimeOnly 'org.apache.logging.log4j:log4j-slf4j2-impl'

    // Lombok
    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    // Jackson
    implementation 'com.fasterxml.jackson.core:jackson-databind'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // Test
    testImplementation 'org.springframework:spring-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation "org.mockito:mockito-core:5.14.2"
    testImplementation "org.mockito:mockito-junit-jupiter:5.14.2"

    testCompileOnly "org.projectlombok:lombok:${lombokVersion}"
    testAnnotationProcessor "org.projectlombok:lombok:${lombokVersion}"

    testImplementation platform("org.junit:junit-bom:${junitVersion}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testImplementation 'org.apache.tomcat.embed:tomcat-embed-core:9.0.120'

    // Stripe
    // 구현 시점에 최신 안정 버전 확인
    implementation 'com.stripe:stripe-java:29.0.0'

    // S3 (영수증 이미지 저장)
    // 버킷은 별도 AWS 계정이 소유하므로 인스턴스 역할이 아니라 IAM 사용자 키로 접근한다.
    implementation 'software.amazon.awssdk:s3'

    // 지표 수집 (Micrometer)
    // Spring Boot가 아니라서 Actuator가 없다. 레지스트리·바인더·노출 엔드포인트를
    // MetricsConfig에서 직접 배선한다.
    implementation platform("io.micrometer:micrometer-bom:${micrometerVersion}")
    implementation 'io.micrometer:micrometer-core'
    implementation 'io.micrometer:micrometer-registry-prometheus'
}

test {
    useJUnitPlatform()

    // 통합 테스트가 조용히 skip되면 초록불이 거짓말을 한다. 실제로 약속 스케줄러의
    // 시간대 버그와 Flyway 기대 버전 단정문이 깨진 채로 이 경로를 통해 main까지 갔다.
    //
    // 판정 기준은 "실제로 한 건이라도 실행된 클래스"다. 클래스 단위
    // @EnabledIfEnvironmentVariable로 꺼져도 Gradle은 메서드별 skip 이벤트를 내보내므로,
    // 이벤트가 왔다는 사실만으로 실행됐다고 볼 수 없다. 반대로 skip 건수만 세면
    // Assumptions.assumeTrue로 정상적으로 건너뛴 메서드까지 실패로 잡는다.
    def gateEnabled = ["RUN_MYSQL_INTEGRATION_TESTS", "RUN_REDIS_INTEGRATION_TESTS"]
            .any { "true".equalsIgnoreCase(System.getenv(it) ?: "") }

    def testSourceRoot = file("src/test/java")
    def expectedIntegrationClasses = fileTree(testSourceRoot) {
        include "**/*IntegrationTest.java"
    }.files.collect { source ->
        testSourceRoot.toPath().relativize(source.toPath()).toString()
                .replaceFirst(/\.java$/, "")
                .replace(File.separator, ".")
    }.toSet()

    def executedClasses = Collections.synchronizedSet([] as Set)
    def skippedTests = Collections.synchronizedList([])

    afterTest { descriptor, result ->
        if (result.resultType.name() == "SKIPPED") {
            skippedTests << "${descriptor.className}.${descriptor.name}"
        } else {
            executedClasses << descriptor.className
        }
    }

    doLast {
        // 메서드 단위 skip(Assumptions.assumeTrue 등)은 실패로 다루지 않고 알리기만 한다.
        // 예: PlaceMapperIntegrationTest.findPlaceDetail_mapsJsonValues는 시드 데이터가
        // 없으면 정상적으로 건너뛴다.
        if (!skippedTests.isEmpty()) {
            logger.lifecycle("건너뛴 테스트 ${skippedTests.size()}건:")
            skippedTests.sort().each { logger.lifecycle("  - ${it}") }
        }

        if (!gateEnabled) {
            return
        }
        // --tests로 범위를 좁혀 돌린 경우에는 대조하지 않는다.
        if (!filter.commandLineIncludePatterns.isEmpty()
                || !filter.includePatterns.isEmpty()) {
            return
        }

        def missing = (expectedIntegrationClasses - executedClasses).sort()
        if (!missing.isEmpty()) {
            throw new GradleException(
                    "통합 테스트 게이트가 켜져 있는데 아래 ${missing.size()}개 클래스에서 "
                            + "실행된 테스트가 한 건도 없습니다.\n"
                            + "먼저 DB·Redis 접속 환경 변수를 확인하세요. 접속이 정상인데도 "
                            + "나온다면, 그 클래스의 모든 메서드가 Assumptions로 건너뛰어졌을 수 "
                            + "있습니다(시드 데이터 부재 등) — 그 경우는 게이트 문제가 아닙니다.\n  "
                            + missing.join("\n  "))
        }
    }
}
