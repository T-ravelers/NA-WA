# 부하 테스트용 nginx 설정.
#
# 운영 설정(nginx/nginx.conf)을 그대로 쓸 수 없는 이유가 둘이다.
#   1. TLS 인증서 파일이 로컬에 없어 nginx가 기동하지 못한다
#   2. 80으로 온 요청을 308로 https://api.na-wa.cloud 에 넘겨서 k6가 무한히 되돌아온다
#
# 그래서 평문 80만 받는 최소 설정을 따로 둔다. 대신 운영과 같아야 의미가 있는 것들
# (업로드 크기, WebSocket upgrade, /internal/ 차단, 프록시 헤더)은 그대로 맞춘다.
#
# ── 이 설정으로 측정되지 않는 것 ──────────────────────────────────────
# TLS 핸드셰이크 비용. 운영은 nginx가 443에서 TLS를 종료하는데 여기서는 평문이다.
# 동시 연결이 수천 개면 핸드셰이크가 CPU를 꽤 쓰므로, 실제 EC2 측정에서는 이만큼
# 여유가 더 필요하다고 봐야 한다.
user  nginx;
worker_processes  auto;

events {
    # 운영(nginx/nginx.conf)과 같은 값. 8,920 VU 규모에서는 운영이 가장 먼저
    # 부딪히는 한계가 정확히 이것이라, 여기를 부풀리면 병목 위치를 못 찾는다.
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    client_max_body_size 12m;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name _;

        # 부하 도구의 로그인만 통과시킨다.
        #
        # 운영에서는 최상위 `/internal/`을 통째로 404로 막지만, 여기서까지 막으면 k6가
        # nginx를 통해 로그인할 수 없다. 그렇다고 로그인만 백엔드 포트로 우회시키면
        # 로그인 요청만 nginx를 안 거쳐서 프록시 부하가 실제보다 적게 잡힌다.
        #
        # 이 경로는 애초에 운영 산출물에 존재하지 않으므로(`-Ploadtest` 빌드 전용)
        # 여기서 열어도 운영 위험이 늘지 않는다. 아래 `/internal/` 차단은 그대로 둔다.
        location = /internal/loadtest/login {
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 운영과 같은 규칙. 지표 엔드포인트가 nginx를 통해서는 닿지 않아야 한다.
        # Prometheus는 컨테이너 포트(127.0.0.1:9081)로 직접 읽는다.
        location /internal/ {
            return 404;
        }

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
