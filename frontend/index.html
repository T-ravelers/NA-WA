<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!--
      Display 폰트 Sztos. 라이선스상 셀프 호스팅할 수 없어 Adobe Fonts(Typekit)로 받는다(#122).
      kit ID는 공개 페이지에 그대로 노출되는 값이며 비밀값이 아니다. Adobe Fonts는
      도메인 허용 목록을 사용하지 않으며, 활성 Creative Cloud 구독이 있어야 계속
      제공된다. 셀프 호스팅 woff2를 다시 추가하지 않는다.
    -->
    <link
      rel="preconnect"
      href="https://use.typekit.net"
      crossorigin
    />
    <link
      rel="preconnect"
      href="https://p.typekit.net"
      crossorigin
    />
    <link
      rel="stylesheet"
      href="https://use.typekit.net/qgv6efy.css"
    />
    <link
      rel="icon"
      href="/pwa-icon.svg"
      type="image/svg+xml"
    />
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon.png"
    />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <meta
      name="theme-color"
      content="#171717"
    />
    <meta
      name="description"
      content="Plan, travel and settle up together"
    />
    <title>NA-WA</title>
  </head>
  <body>
    <div id="app"></div>
    <script
      type="module"
      src="/src/main.ts"
    ></script>
  </body>
</html>
