user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Upgrade 헤더가 없는 일반 요청은 커넥션을 닫고, 있으면(WebSocket) upgrade 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ALB가 TLS를 종료하면 이 서버의 $scheme은 항상 http가 되므로, 백엔드에 원래 프로토콜을
    # 알리려면 ALB가 붙인 헤더를 그대로 넘겨야 한다. 헤더가 없는 직접 접속은 $scheme으로 되돌린다.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name api.clearpng.cloud;

        # certbot이 도메인 소유를 검증할 때 쓰는 경로 (갱신 시에도 계속 필요해 80을 완전히 막지 않음)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ALB가 443에서 TLS를 종료하고 평문 80으로 넘기므로, 여기가 정상 트래픽의 입구가 된다.
        # 308을 유지하면 ALB가 그 응답을 그대로 전달해 클라이언트가 무한히 되돌아온다.
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.clearpng.cloud;

        ssl_certificate     /etc/letsencrypt/live/api.clearpng.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.clearpng.cloud/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
