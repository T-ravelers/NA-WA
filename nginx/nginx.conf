user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # 영수증 사진 업로드용. 기본값 1MB에서는 백엔드에 닿기도 전에 413이 난다.
    # 백엔드의 RECEIPT_MAX_UPLOAD_BYTES(기본 8MB)보다 커야 크기 초과를 앱이 판단해 응답한다.
    client_max_body_size 12m;

    # Upgrade 헤더가 없는 일반 요청은 커넥션을 닫고, 있으면(WebSocket) upgrade 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ALB가 TLS를 종료하면 80으로 넘어온 요청의 $scheme은 항상 http가 되므로, 백엔드에
    # 원래 프로토콜을 알리려면 ALB가 붙인 헤더를 참고해야 한다. 아는 값만 통과시키고
    # 빈 값·이상값·중복값은 이 서버가 실제로 받은 프로토콜로 되돌려 위조를 막는다.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name api.na-wa.cloud;

        # ALB 헬스 체크용 경로. 항상 백엔드까지 통과시킨다. 다만 백엔드에 이 경로 매핑이
        # 없어 404가 나므로, 이 상태로 잡히는 것은 backend 컨테이너가 죽어 502가 날
        # 때뿐이다. WAR 배포가 실패해 Tomcat만 살아 404를 내는 상태는 구분되지 않는다 —
        # 세 상태를 갈라내려면 백엔드에 전용 헬스 엔드포인트를 추가하고 matcher를
        # 200으로 좁혀야 한다.
        location = /alb-health {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # 지표 엔드포인트는 외부에 열지 않는다. JVM 힙·스레드 상태가 인증 없이
        # 공개되면 내부 구조가 그대로 드러난다. 부하 테스트에서는 nginx를 거치지 않고
        # 컨테이너 포트로 직접 수집하므로 여기서 막아도 관측에 지장이 없다.
        location /internal/ {
            # 로그를 끄지 않는다. 외부에서 내부 경로를 두드린 흔적은 남는 편이 낫다.
            return 404;
        }

        # ALB가 443에서 TLS를 종료하고 평문 80으로 넘기므로, 여기가 유일한 입구다.
        # EC2는 private 서브넷에 있고 보안 그룹이 ALB의 80만 허용해 직접 접속은 닿지 않는다.
        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }
}
