user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Upgrade 헤더가 없는 일반 요청은 커넥션을 닫고, 있으면(WebSocket) upgrade 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ALB가 TLS를 종료하면 80으로 넘어온 요청의 $scheme은 항상 http가 되므로, 백엔드에
    # 원래 프로토콜을 알리려면 ALB가 붙인 헤더를 참고해야 한다. 아는 값만 통과시키고
    # 빈 값·이상값·중복값은 이 서버가 실제로 받은 프로토콜로 되돌려 위조를 막는다.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        https   https;
        http    http;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name api.clearpng.cloud;

        # certbot이 도메인 소유를 검증할 때 쓰는 경로 (갱신 시에도 계속 필요해 80을 완전히 막지 않음)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # ALB 헬스 체크 요청에는 X-Forwarded-Proto가 붙지 않아 아래 리다이렉트에 걸린다.
        # 그러면 nginx만 살아 있어도 정상으로 보이므로, 정확히 일치하는 이 경로만
        # 항상 백엔드까지 통과시킨다. 다만 백엔드에 이 경로 매핑이 없어 404가 나므로,
        # 이 상태로 잡히는 것은 backend 컨테이너가 죽어 502가 날 때뿐이다. WAR 배포가
        # 실패해 Tomcat만 살아 404를 내는 상태는 구분되지 않는다 — 세 상태를 갈라내려면
        # 백엔드에 전용 헬스 엔드포인트를 추가하고 matcher를 200으로 좁혀야 한다.
        location = /alb-health {
            access_log off;
            proxy_pass http://backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # ALB가 443에서 TLS를 종료하고 평문 80으로 넘기므로, 여기가 정상 트래픽의 입구가 된다.
        # 308을 유지하면 ALB가 그 응답을 그대로 전달해 클라이언트가 무한히 되돌아온다.
        location / {
            # 헤더가 없으면 ALB를 거치지 않은 직접 접속이다. ALB 전환이 끝날 때까지
            # 평문 접속이 그대로 처리되지 않도록 기존처럼 https로 올린다.
            if ($http_x_forwarded_proto = '') {
                return 308 https://api.clearpng.cloud$request_uri;
            }

            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name api.clearpng.cloud;

        ssl_certificate     /etc/letsencrypt/live/api.clearpng.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.clearpng.cloud/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 이 블록은 nginx가 직접 TLS를 종료하므로 클라이언트 헤더를 볼 이유가 없다
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
