user  nginx;
worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout  65;

    # Upgrade 헤더가 없는 일반 요청은 커넥션을 닫고, 있으면(WebSocket) upgrade 처리
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    upstream backend {
        server backend:8080;
    }

    server {
        listen 80;
        server_name api.clearpng.cloud;

        # certbot이 도메인 소유를 검증할 때 쓰는 경로 (갱신 시에도 계속 필요해 80을 완전히 막지 않음)
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name api.clearpng.cloud;

        ssl_certificate     /etc/letsencrypt/live/api.clearpng.cloud/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/api.clearpng.cloud/privkey.pem;

        location / {
            proxy_pass http://backend;
            proxy_http_version 1.1;

            # WebSocket upgrade
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
