services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - nawa-network

  backend:
    image: ${DOCKERHUB_USERNAME}/nawa-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      REDIS_TIMEOUT_MILLIS: ${REDIS_TIMEOUT_MILLIS:-2000}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nawa:}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-nawa}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
      AUTH_FRONTEND_SUCCESS_URL: ${AUTH_FRONTEND_SUCCESS_URL}
      AUTH_FRONTEND_FAILURE_URL: ${AUTH_FRONTEND_FAILURE_URL}
      AUTH_FRONTEND_ALLOWED_RETURN_PATHS: ${AUTH_FRONTEND_ALLOWED_RETURN_PATHS:-/}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-openid,profile,email}
      LINE_OAUTH_CLIENT_ID: ${LINE_OAUTH_CLIENT_ID}
      LINE_OAUTH_CLIENT_SECRET: ${LINE_OAUTH_CLIENT_SECRET}
      LINE_OAUTH_REDIRECT_URI: ${LINE_OAUTH_REDIRECT_URI}
      LINE_OAUTH_SCOPES: ${LINE_OAUTH_SCOPES:-openid,profile}
      OAUTH_HTTP_CONNECT_TIMEOUT_MILLIS: ${OAUTH_HTTP_CONNECT_TIMEOUT_MILLIS:-3000}
      OAUTH_HTTP_READ_TIMEOUT_MILLIS: ${OAUTH_HTTP_READ_TIMEOUT_MILLIS:-5000}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nawa-network

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nawa-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - nawa-network

volumes:
  mysql_data:
  redis_data:

networks:
  nawa-network:
    driver: bridge
