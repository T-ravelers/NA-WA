services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - certbot_www:/var/www/certbot:ro
      - certbot_conf:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - nawa-network

  # 상시 기동하지 않음. 최초 발급/갱신은 `docker compose run --rm certbot ...`으로
  # 필요할 때만 실행하고(갱신은 .github/workflows/renew-cert.yml이 매일 트리거),
  # 이미지 기본 entrypoint(`certbot`)를 그대로 써야 하므로 여기서 재정의하지 않습니다.
  certbot:
    image: certbot/certbot
    profiles: ["ops"]
    volumes:
      - certbot_www:/var/www/certbot
      - certbot_conf:/etc/letsencrypt

  backend:
    image: ${DOCKERHUB_USERNAME}/nawa-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_DRIVER: com.mysql.cj.jdbc.Driver
      DATABASE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
      DATABASE_USERNAME: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_SSL_ENABLED: ${REDIS_SSL_ENABLED:-false}
      REDIS_TIMEOUT_MILLIS: ${REDIS_TIMEOUT_MILLIS:-2000}
      REDIS_KEY_PREFIX: ${REDIS_KEY_PREFIX:-nawa:}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ISSUER: ${JWT_ISSUER:-nawa}
      JWT_ACCESS_TOKEN_TTL_SECONDS: ${JWT_ACCESS_TOKEN_TTL_SECONDS:-900}
      REFRESH_TOKEN_TTL_SECONDS: ${REFRESH_TOKEN_TTL_SECONDS:-1209600}
      OAUTH_STATE_TTL_SECONDS: ${OAUTH_STATE_TTL_SECONDS:-600}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_COOKIE_SAME_SITE: ${AUTH_COOKIE_SAME_SITE:-Lax}
      AUTH_COOKIE_DOMAIN: ${AUTH_COOKIE_DOMAIN:-}
      AUTH_ACCESS_COOKIE_NAME: ${AUTH_ACCESS_COOKIE_NAME:-access_token}
      AUTH_REFRESH_COOKIE_NAME: ${AUTH_REFRESH_COOKIE_NAME:-refresh_token}
      AUTH_OAUTH_STATE_COOKIE_NAME: ${AUTH_OAUTH_STATE_COOKIE_NAME:-oauth_state}
      AUTH_FRONTEND_SUCCESS_URL: ${AUTH_FRONTEND_SUCCESS_URL}
      AUTH_FRONTEND_FAILURE_URL: ${AUTH_FRONTEND_FAILURE_URL}
      AUTH_FRONTEND_ALLOWED_RETURN_PATHS: ${AUTH_FRONTEND_ALLOWED_RETURN_PATHS:-/}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI}
      GOOGLE_OAUTH_SCOPES: ${GOOGLE_OAUTH_SCOPES:-openid,profile,email}
      LINE_OAUTH_CLIENT_ID: ${LINE_OAUTH_CLIENT_ID}
      LINE_OAUTH_CLIENT_SECRET: ${LINE_OAUTH_CLIENT_SECRET}
      LINE_OAUTH_REDIRECT_URI: ${LINE_OAUTH_REDIRECT_URI}
      LINE_OAUTH_SCOPES: ${LINE_OAUTH_SCOPES:-openid,profile}
      OAUTH_HTTP_CONNECT_TIMEOUT_MILLIS: ${OAUTH_HTTP_CONNECT_TIMEOUT_MILLIS:-3000}
      OAUTH_HTTP_READ_TIMEOUT_MILLIS: ${OAUTH_HTTP_READ_TIMEOUT_MILLIS:-5000}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      AWS_S3_RECEIPT_BUCKET: ${AWS_S3_RECEIPT_BUCKET:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      RECEIPT_MAX_UPLOAD_BYTES: ${RECEIPT_MAX_UPLOAD_BYTES:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - nawa-network

  mysql:
    image: mysql:8.4
    # 이미지 기본값은 UTC입니다. 백엔드 컨테이너는 TZ=Asia/Seoul이라 그대로 두면 DB가
    # 평가하는 CURRENT_TIMESTAMP·NOW()가 앱보다 9시간 뒤처집니다. JDBC URL의
    # serverTimezone은 드라이버의 값 변환 설정일 뿐이라 이 차이를 메우지 못합니다.
    # 이름 있는 시간대(Asia/Seoul)는 시간대 테이블을 미리 적재해야 해서 숫자 오프셋을
    # 씁니다. 한국은 서머타임이 없어 +09:00이 항상 유효합니다.
    command: --default-time-zone=+09:00
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - nawa-network

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - nawa-network

volumes:
  mysql_data:
  redis_data:
  certbot_www:
  certbot_conf:

networks:
  nawa-network:
    driver: bridge
